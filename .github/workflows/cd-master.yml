name: CD Master
on:
  push:
    branches: [master]

jobs:
  cd:
    name: Build & Push GHCR Image & Deploy on AWS Lightsail
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Prepare container image metadata (repository in lowercase, artifact, version...)
        run: |
          echo "GHCR_URL=ghcr.io" >> $GITHUB_ENV
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # 1º Crear Token de Acceso Personal:
      #    GitHub → Settings → Developer settings → Personal access tokens → Generate new token (classic)
      #    Permisos mínimos: write:packages, read:packages, delete:packages, repo
      # 2º Crear secret en GitHub:
      #    Repo → Settings → Secrets and variables → Actions → New repository secret
      #    Name: GHCR_PERSONAL_ACCESS_TOKEN, Value: <tu token>
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest

      # 🌐 Despliegue en AWS Lightsail
      # Secrets requeridos: AWS_LIGHTSAIL_IP_MAIN, AWS_LIGHTSAIL_USER_MAIN, AWS_LIGHTSAIL_SSH_KEY_MAIN,
      # GHCR_PERSONAL_ACCESS_TOKEN, POSTGRES_USER, POSTGRES_PASSWORD
      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          command_timeout: 20m
          envs: GHCR_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD
          script: |
            echo "$GHCR_TOKEN" | docker login ${{ env.GHCR_URL }} -u ${{ github.actor }} --password-stdin

            docker network create devops || true

            docker pull ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest
            docker rm -f ${{ env.ARTIFACT }} || true
            docker run -d \
              --name ${{ env.ARTIFACT }} \
              --restart always \
              --memory 300m \
              --memory-swap 700m \
              --network devops \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JAVA_TOOL_OPTIONS="-Xmx192m -Xss256k -XX:MaxMetaspaceSize=96m" \
              -e POSTGRES_USER="$POSTGRES_USER" \
              -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest

            echo "⏳ Esperando a que se levante"
            for i in $(seq 1 6); do
              sleep 15
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.ARTIFACT }} 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] && break
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Deploy fallido"
              docker logs --tail 50 ${{ env.ARTIFACT }}
              exit 1
            fi

            echo "✅ Deploy exitoso"
            docker image prune --filter "until=12h" -f
