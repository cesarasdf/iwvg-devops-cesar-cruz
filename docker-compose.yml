services:
  devops:
    build: .
    image: devops:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
    networks:
      - devopsNet

networks:
  devopsNet:
    external: true

#> docker compose up --build -d
# Requiere que la BD ya esté arrancada: docker compose -f docker-compose-db.yml -p databases up -d